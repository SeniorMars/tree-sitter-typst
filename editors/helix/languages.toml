[language-server.tinymist]
command = "tinymist"

[[language]]
name = "typst"
scope = "source.typst"
file-types = ["typ", "typst"]
comment-token = "//"
indent = { tab-width = 2, unit = "  " }
injection-regex = "^typ(st)?$"
language-servers = ["tinymist"]

[language.auto-pairs]
"(" = ")"
"{" = "}"
"[" = "]"
"$" = "$"
"\"" = "\""

[[grammar]]
name = "typst"
source.git = "https://github.com/SeniorMars/tree-sitter-typst"
source.rev = "main"
